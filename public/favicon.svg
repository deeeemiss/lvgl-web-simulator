<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Device frame -->
  <rect x="4" y="10" width="56" height="44" rx="6" fill="url(#accent)"/>
  <!-- Screen -->
  <rect x="8" y="14" width="48" height="32" rx="3" fill="url(#screenBg)"/>

  <!-- Status bar -->
  <rect x="11" y="17" width="42" height="3" rx="1" fill="#475569"/>
  <circle cx="51" cy="18.5" r="1" fill="#22c55e"/>

  <!-- UI button -->
  <rect x="20" y="28" width="24" height="10" rx="2" fill="url(#accent)"/>
  <rect x="24" y="32" width="16" height="2" rx="1" fill="#ffffff" opacity="0.95"/>

  <!-- Bottom dots -->
  <circle cx="18" cy="42" r="1" fill="#3b82f6"/>
  <circle cx="22" cy="42" r="1" fill="#475569"/>
  <circle cx="26" cy="42" r="1" fill="#475569"/>

  <!-- Stand -->
  <rect x="26" y="54" width="12" height="3" rx="1" fill="url(#accent)"/>
  <rect x="20" y="57" width="24" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
